<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {

      padding: 24px;
      background-color: #0B1120;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      margin-bottom: 16px;
      border-bottom: 1px solid #1E293B;
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 22px;
      color: #38BDF8;
      margin: 0 0 6px 0;
    }
    p {
      color: #94A3B8;
      margin: 0;
      font-size: 13px;
    }
    .legend {
      display: flex;
      gap: 16px;
      font-size: 13px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
    #network-container {
      width: 100%;
      height: 700px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #1E293B;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);

</head>
<body>

LAIM", "color": {"color": "#8B5CF6", "opacity": 0.5}, "arrows": "to"}, {"from": "paper_paper_001", "to": "C004", "label": "SUPPORTS (0.90)", "color": {"color": "#10B981", "highlight": "#34D399"}, "width": 2.5, "arrows": "to"}, {"from": "paper_paper_001", "to": "C004", "label": "SUPPORTS (0.88)", "color": {"color": "#10B981", "highlight": "#34D399"}, "width": 2.5, "arrows": "to"}, {"from": "paper_paper_001", "to": "C004", "label": "SUPPORTS (0.88)", "color": {"color": "#10B981", "highlight": "#34D399"}, "width": 2.5, "arrows": "to"}, {"from": "paper_paper_001", "to": "C004", "label": "SUPPORTS (0.86)", "color": {"color": "#10B981", "highlight": "#34D399"}, "width": 2.5, "arrows": "to"}]);
    const container = document.getElementById("network-container");
    const data = { nodes: nodes, edges: edges };
    const options = {
      physics: {
        stabilization: true,
        barnesHut: {
          gravitationalConstant: -3500,
          centralGravity: 0.35,
          springLength: 120,
          springConstant: 0.04
        }
      },
      interaction: {
        hover: true,
        tooltipDelay: 150,
        navigationButtons: true,
        keyboard: true
      }
    };
    const network = new vis.Network(container, data, options);
  </script>
</body>
</html>

name: EvidenceFirst-RAG CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Pytest Test Suite
      run: |
        pytest -v tests/

    - name: Validate Pipeline CLI & Ablation Study
      run: |
        python main.py --benchmark
        python main.py --benchmark-ir

    - name: Validate LaTeX, HTML & Slide Deck Publication Export
      run: |
        python main.py --query "What are the limitations of Vision Transformers for low-light object detection?" --iterative --hypotheses --rigor --peer-review --debate-council --bibliometrics --export-latex --export-html --export-sankey --export-slides

